ontainer/40" onclick="simulateTransition(2)"><div class="w-24 h-24 rounded-full bg-surface-deep flex items-center justify-center text-on-surface group-hover:text-primary group-hover:scale-110 transition-all duration-300 scale-125"><span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 0;">edit_document</span></div><div><h2 class="font-headline-h3 text-headline-h3 mb-2 group-hover:text-primary transition-colors">Manual Entry</h2><p class="font-body-md text-body-md text-text-secondary">Type in the details yourself. Best for rare or uncataloged editions.</p></div></button></div>

<script>
        function simulateTransition(step) {
            const step1 = document.getElementById('step-1-container');
            const step2 = document.getElementById('step-2-container');
            const dot1 = document.getElementById('step-dot-1');
            const dot2 = document.getElementById('step-dot-2');
            const label = document.getElementById('step-label');

            if (step === 2) {
                // Animate out step 1
                step1.classList.remove('fade-enter-active');
                step1.classList.add('fade-exit-active');
                
                setTimeout(() => {
                    step1.classList.add('hidden-state');
                    step1.classList.remove('fade-exit-active');
                    
                    // Show step 2
                    step2.classList.remove('hidden-state');
                    // small delay to allow display:block to apply before animating opacity
                    requestAnimationFrame(() => {
                        step2.classList.add('fade-enter-active');
                    });
                    
                    // Update Stepper
                    dot2.classList.replace('bg-surface-variant', 'bg-primary');
                    dot2.classList.add('shadow-[0_0_12px_rgba(192,193,255,0.4)]');
                    label.innerText = 'Step 2 of 3';
                }, 300);
            } else if (step === 1) {
                // Go back
                step2.classList.remove('fade-enter-active');
                step2.classList.add('fade-exit-active');
                
                setTimeout(() => {
                    step2.classList.add('hidden-state');
                    step2.classList.remove('fade-exit-active');
                    
                    step1.classList.remove('hidden-state');
                    requestAnimationFrame(() => {
                        step1.classList.add('fade-enter-active');
                    });
                    
                    // Update Stepper
                    dot2.classList.replace('bg-primary', 'bg-surface-variant');
                    dot2.classList.remove('shadow-[0_0_12px_rgba(192,193,255,0.4)]');
                    label.innerText = 'Step 1 of 3';
                }, 300);
            }
        }
    </script>
