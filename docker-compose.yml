services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kakurega}
      POSTGRES_USER: ${POSTGRES_USER:-kakurega}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kakurega_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kakurega} -d ${POSTGRES_DB:-kakurega}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      KAKUREGA_DATABASE_URL: ${KAKUREGA_DATABASE_URL:-postgresql+psycopg://kakurega:kakurega_password@postgres:5432/kakurega}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      KAKUREGA_APP_NAME: ${KAKUREGA_APP_NAME:-Kakurega API}
      KAKUREGA_ENVIRONMENT: ${KAKUREGA_ENVIRONMENT:-development}
      KAKUREGA_DEBUG: ${KAKUREGA_DEBUG:-true}
      KAKUREGA_API_V1_PREFIX: ${KAKUREGA_API_V1_PREFIX:-/api/v1}
      KAKUREGA_DATABASE_URL: ${KAKUREGA_DATABASE_URL:-postgresql+psycopg://kakurega:kakurega_password@postgres:5432/kakurega}
      KAKUREGA_CORS_ALLOWED_ORIGINS: ${KAKUREGA_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
